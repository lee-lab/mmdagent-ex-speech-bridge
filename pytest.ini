[pytest]
testpaths = tests
# Opt-in tests: run them with  pytest -m requires_engine  /  pytest -m requires_openai -s
addopts = -m "not requires_engine and not requires_openai"
markers =
    requires_engine: needs a running MMDAgent-EX with Plugin_API enabled
    requires_openai: calls the OpenAI API (needs OPENAI_API_KEY; billed)
